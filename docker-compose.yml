services:
  app:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - path: server/.env
        required: false
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/mailgen
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo-data:
